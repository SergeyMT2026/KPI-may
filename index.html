:root {
  --bg: #f5f2ed;
  --ink: #1a1714;
  --ink2: #4a4540;
  --ink3: #9a948e;
  --surface: #ffffff;
  --border: #e0dbd4;
  --border2: #ccc6be;
  --red: #c0392b;
  --orange: #d35400;
  --yellow: #c8960c;
  --green: #1a7a3c;
  --ff: 'Syne', sans-serif;
  --fm: 'JetBrains Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:var(--ff); min-height:100vh; }

/* HEADER */
.top-bar {
  background:var(--ink); color:var(--bg);
  padding:18px 32px;
  display:flex; align-items:center; justify-content:space-between;
}
.top-bar-title { font-size:13px; font-weight:700; letter-spacing:4px; text-transform:uppercase; font-family:var(--fm); }
.top-bar-meta { font-family:var(--fm); font-size:11px; color:#9a9690; letter-spacing:1px; }

/* DEPT SUMMARY */
.dept-summary {
  background:var(--ink); color:var(--bg);
  padding:20px 32px; border-bottom:1px solid var(--border);
}
.dept-summary-row { display:flex; gap:16px; align-items:stretch; }
.dept-headline {
  flex:0 0 220px; display:flex; flex-direction:column; justify-content:center;
  padding-right:16px; border-right:1px solid #2a2724;
}
.dept-headline-label { font-family:var(--fm); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#8a8580; margin-bottom:6px; }
.dept-headline-val { font-size:34px; font-weight:800; letter-spacing:-0.5px; line-height:1; }
.dept-headline-sub { font-family:var(--fm); font-size:11px; color:#b8b3ab; margin-top:6px; }
.dept-kpis { flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.dept-kpi { background:#2a2724; padding:10px 14px; }
.dept-kpi-label { font-family:var(--fm); font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#8a8580; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dept-kpi-row { display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
.dept-kpi-pct { font-family:var(--fm); font-size:18px; font-weight:700; }
.dept-kpi-fact { font-family:var(--fm); font-size:10px; color:#b8b3ab; }
.dept-kpi-bar { height:3px; background:#1a1714; margin-top:6px; overflow:hidden; }
.dept-kpi-bar-fill { height:100%; transition:width 0.8s ease; }

/* LAYOUT */
.layout { display:grid; grid-template-columns:340px 1fr; min-height:calc(100vh - 130px); }

/* LEFT PANEL */
.panel-left {
  border-right:1px solid var(--border); background:var(--surface);
  overflow-y:auto; max-height:calc(100vh - 130px); position:sticky; top:0;
}
.panel-header {
  padding:18px 24px 14px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--surface); z-index:10;
}
.panel-header-title { font-size:11px; font-family:var(--fm); letter-spacing:3px; text-transform:uppercase; color:var(--ink3); margin-bottom:12px; }
.sort-tabs { display:flex; gap:4px; font-family:var(--fm); font-size:10px; }
.sort-tab { padding:4px 10px; border:1px solid var(--border); cursor:pointer; color:var(--ink3); transition:all 0.15s; letter-spacing:1px; text-transform:uppercase; }
.sort-tab.active, .sort-tab:hover { background:var(--ink); color:var(--bg); border-color:var(--ink); }

/* Agent items */
.agent-item { padding:13px 24px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.12s; }
.agent-item:hover { background:#f0ece6; }
.agent-item.active { background:var(--ink); color:var(--bg); }
.agent-item.active .ag-name { color:var(--bg); }
.agent-item.active .ag-meta { color:#9a9690; }
.agent-item.active .ag-pct { color:var(--bg); }
.agent-item.total { background:var(--ink); color:var(--bg); border-bottom:3px solid #2a2724; }
.agent-item.total:hover { background:#2a2724; }
.agent-item.total .ag-name { color:var(--bg); font-size:13px; letter-spacing:1.5px; }
.agent-item.total .ag-meta { color:#b8b3ab; }
.agent-item.total .ag-bar-wrap { background:#3a3431; }
.agent-item.total.active { background:#2a2724; }

.ag-row1 { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.ag-name { font-weight:700; font-size:14px; color:var(--ink); }
.ag-pct { font-family:var(--fm); font-size:16px; font-weight:700; }
.ag-bar-wrap { height:3px; background:var(--border); margin-bottom:6px; overflow:hidden; }
.ag-bar-fill { height:100%; transition:width 0.6s ease; }
.ag-meta { display:flex; justify-content:space-between; font-family:var(--fm); font-size:10px; color:var(--ink3); }
.ag-forecast { margin-top:3px; font-size:9px; opacity:0.85; }
.ag-forecast b { font-weight:700; }
.team-sep { padding:7px 24px 4px; font-family:var(--fm); font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--ink3); background:var(--bg); border-bottom:1px solid var(--border); border-top:1px solid var(--border); margin-top:4px; }

/* RIGHT PANEL */
.panel-right { padding:32px; overflow-y:auto; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; min-height:400px; color:var(--ink3); font-family:var(--fm); font-size:12px; letter-spacing:2px; text-transform:uppercase; gap:12px; }
.empty-arrow { font-size:32px; color:var(--border2); }

/* Detail header */
.detail-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:28px; padding-bottom:24px; border-bottom:2px solid var(--ink); }
.detail-name { font-size:36px; font-weight:800; letter-spacing:-1px; line-height:1; }
.detail-team { font-family:var(--fm); font-size:11px; color:var(--ink3); letter-spacing:2px; margin-top:6px; text-transform:uppercase; }
.detail-score { text-align:right; }
.detail-score-val { font-family:var(--fm); font-size:50px; font-weight:700; line-height:1; }
.detail-score-label { font-family:var(--fm); font-size:10px; color:var(--ink3); letter-spacing:2px; text-transform:uppercase; }

/* Forecast banner */
.forecast-banner { display:flex; gap:12px; margin-bottom:28px; }
.fc-card { flex:1; padding:14px 18px; border:1px solid var(--border); background:var(--surface); }
.fc-card-label { font-family:var(--fm); font-size:9px; color:var(--ink3); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
.fc-card-val { font-family:var(--fm); font-size:18px; font-weight:700; }
.fc-card-sub { font-family:var(--fm); font-size:10px; color:var(--ink3); margin-top:2px; }

/* Section */
.section { margin-bottom:28px; }
.section-title { font-family:var(--fm); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--ink3); margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* KPI row */
.kpi-row {
  display:grid; grid-template-columns:200px 1fr 56px 56px 80px 80px 90px;
  align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);
  animation:fadeUp 0.3s ease both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.kpi-label { font-size:13px; font-weight:700; color:var(--ink); }
.kpi-bar-track { height:8px; background:var(--border); position:relative; overflow:hidden; }
.kpi-bar-fill { height:100%; transition:width 0.8s cubic-bezier(0.16,1,0.3,1); }
.kpi-pct { font-family:var(--fm); font-size:14px; font-weight:700; text-align:right; }
.kpi-prog { font-family:var(--fm); font-size:11px; font-weight:700; text-align:right; padding:2px 5px; border-radius:1px; }
.kpi-fact { font-family:var(--fm); font-size:11px; color:var(--ink3); text-align:right; }
.kpi-plan { font-family:var(--fm); font-size:11px; color:var(--ink3); text-align:right; }
.kpi-perday { font-family:var(--fm); font-size:12px; font-weight:700; text-align:right; padding:4px 8px; background:#fff4d6; border:1px solid #e8d49a; color:#8a6d10; }
.kpi-perday.done { background:#e8f5e8; border-color:#b5d8b5; color:var(--green); }
.kpi-perday.hot { background:#fde4e0; border-color:#e8b5ad; color:var(--red); }
/* АКБ/ВАЛ мониторинг */

.monitor-label { font-size:12px; font-weight:400; color:var(--ink2); font-style:italic; }

.dist-col-title { font-family:var(--fm); font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:6px 10px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }

.dist-col-title.worst-akb { background:rgba(211,84,0,0.08); color:var(--orange); }

.dist-target { font-family:var(--fm); font-size:10px; color:var(--ink3); text-align:right; }
.dist-bar { grid-column:1/-1; height:3px; background:var(--border); overflow:hidden; margin-top:-2px; }
.dist-bar-fill { height:100%; transition:width 0.7s ease; }

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
const pct = (f,p) => p>0 ? Math.round(f/p*100) : 0;
const fmtRub = n => n>=1000000 ? (n/1000000).toFixed(1)+'M' : n>=1000 ? Math.round(n/1000)+'К' : String(n);
const color = p => p>=100?'var(--green)':p>=80?'var(--yellow)':p>=60?'var(--orange)':'var(--red)';
const bgClass = p => p>=100?'bg-green':p>=80?'bg-yellow':p>=60?'bg-orange':'bg-red';
const cClass = p => p>=100?'c-green':p>=80?'c-yellow':p>=60?'c-orange':'c-red';
const ppd = (plan,fact) => CAL.days_left>0 ? Math.round((plan-fact)/CAL.days_left) : 0;
const pdClass = (plan,fact) => fact>=plan?'done': ppd(plan,fact)>plan/CAL.days_total*1.5?'hot':'';
const progStyle = p => p>=100?'background:#e8f5e8;color:var(--green)':p>=80?'background:#fff4d6;color:#8a6d10':'background:#fde4e0;color:var(--red)';

// ═══════════════════════════════════════
// DEPT SUMMARY
// ═══════════════════════════════════════
function renderDept() {
  const t = AGENTS.find(a=>a.id==='total');
  const valP = pct(t.valFact, t.valPlan);
  const kpiItems = t.kpis.map(k=>{
    const p = k.pct;
    return `<div class="dept-kpi">
      <div class="dept-kpi-label">${k.name}</div>
      <div class="dept-kpi-row">
        <span class="dept-kpi-pct ${cClass(p)}">${p}%</span>
        <span class="dept-kpi-fact" style="font-size:9px;${progStyle(k.prog)};padding:1px 4px;">${k.prog}%</span>
      </div>
      <div class="dept-kpi-bar"><div class="dept-kpi-bar-fill ${bgClass(p)}" style="width:${Math.min(p,100)}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('dept-summary').innerHTML = `
    <div class="dept-summary-row">
      <div class="dept-headline">
        <div class="dept-headline-label">Общий вал</div>
        <div class="dept-headline-val ${cClass(valP)}">${valP}%</div>
        <div class="dept-headline-sub">${fmtRub(t.valFact)} / ${fmtRub(t.valPlan)}</div>
      </div>
      <div class="dept-kpis">${kpiItems}</div>
    </div>`;
}

// ═══════════════════════════════════════
// AGENT LIST
// ═══════════════════════════════════════
let currentSort = 'val';
let activeId = null;

function agentCard(a) {
  const vP = pct(a.valFact, a.valPlan);
  const aP = pct(a.akbFact, a.akbPlan);
  const progVal = Math.round(a.valProg);
  const isActive = a.id === activeId;
  return `<div class="agent-item${a.id==='total'?' total':''}${isActive?' active':''}" data-id="${a.id}" onclick="selectAgent('${a.id}')">
    <div class="ag-row1">
      <div class="ag-name">${a.name}</div>
      <div class="ag-pct ${isActive?'':cClass(vP)}">${vP}%</div>
    </div>
    <div class="ag-bar-wrap"><div class="ag-bar-fill ${bgClass(vP)}" style="width:${Math.min(vP,100)}%"></div></div>
    <div class="ag-meta">
      <span>АКБ: ${a.akbFact}/${a.akbPlan} (${aP}%)</span>
      <span>${fmtRub(a.valFact)} / ${fmtRub(a.valPlan)}</span>
    </div>
    <div class="ag-meta ag-forecast">
      <span>Прогноз: <b style="color:${isActive?'#fff':color(progVal)}">${progVal}%</b></span>
      <span>≈ ${fmtRub(a.valProgRub)}</span>
    </div>
  </div>`;
}

function sortAgents(by, el) {
  currentSort = by;
  document.querySelectorAll('.sort-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function renderList() {
  const total = AGENTS.find(a=>a.id==='total');
  let html = agentCard(total);

  if (currentSort === 'name') {
    TEAMS_ORDER.forEach(team => {
      html += `<div class="team-sep">${team.sep}</div>`;
      team.ids.forEach(id => {
        const a = AGENTS.find(x=>x.id===id);
        if(a) html += agentCard(a);
      });
    });
  } else {
    const rest = AGENTS.filter(a=>a.id!=='total');
    rest.sort((a,b)=>{
      if(currentSort==='val') return pct(b.valFact,b.valPlan)-pct(a.valFact,a.valPlan);
      if(currentSort==='akb') return pct(b.akbFact,b.akbPlan)-pct(a.akbFact,a.akbPlan);
      return 0;
    });
    rest.forEach(a => html += agentCard(a));
  }
  document.getElementById('agent-list').innerHTML = html;
}

function selectAgent(id) {
  activeId = id;
  renderList();

  const a = AGENTS.find(x=>x.id===id);
  if(!a) return;

  const vP = pct(a.valFact, a.valPlan);
  const aP = pct(a.akbFact, a.akbPlan);

  // КПИ строки
  let kpiHtml = '';
  a.kpis.forEach((k,i)=>{
    const p = k.pct;
    const pd = k.ppd;
    const pdC = pd<=0?'done':pd>k.plan/CAL.days_total*1.8?'hot':'';
    kpiHtml += `<div class="kpi-row" style="animation-delay:${i*0.05}s">
      <div class="kpi-label">${k.name}</div>
      <div class="kpi-bar-track"><div class="kpi-bar-fill ${bgClass(p)}" style="width:${Math.min(p,100)}%"></div></div>
      <div class="kpi-pct ${cClass(p)}">${p}%</div>
      <div class="kpi-prog" style="${progStyle(k.prog)}">${k.prog}%</div>
      <div class="kpi-fact">${k.fact} ${k.unit}</div>
      <div class="kpi-plan">из ${k.plan}</div>
      <div class="kpi-perday ${pdC}">${pd<=0?'✓':Math.abs(pd)+'/д'}</div>
    </div>`;
  });

  // АКБ и ВАЛ — мониторинг
  kpiHtml += `<div style="padding:8px 0 4px;font-family:var(--fm);font-size:9px;color:var(--ink3);letter-spacing:2px;text-transform:uppercase;margin-top:4px;border-top:1px solid var(--border)">мониторинг</div>`;
  kpiHtml += `<div class="monitor-row">
    <div class="monitor-label">АКБ (общий)</div>
    <div class="kpi-bar-track"><div class="kpi-bar-fill ${bgClass(aP)}" style="width:${Math.min(aP,100)}%"></div></div>
    <div class="kpi-pct ${cClass(aP)}">${aP}%</div>
    <div class="kpi-prog" style="${progStyle(a.akbProg)}">${a.akbProg}%</div>
    <div class="kpi-fact">${a.akbFact} точек</div>
    <div class="kpi-plan">из ${a.akbPlan}</div>
    <div class="kpi-perday">${ppd(a.akbPlan,a.akbFact)}/д</div>
  </div>
  <div class="monitor-row">
    <div class="monitor-label">Общий ВАЛ</div>
    <div class="kpi-bar-track"><div class="kpi-bar-fill ${bgClass(vP)}" style="width:${Math.min(vP,100)}%"></div></div>
    <div class="kpi-pct ${cClass(vP)}">${vP}%</div>
    <div class="kpi-prog" style="${progStyle(a.valProg)}">${a.valProg}%</div>
    <div class="kpi-fact">${fmtRub(a.valFact)} ₽</div>
    <div class="kpi-plan">из ${fmtRub(a.valPlan)}</div>
    <div class="kpi-perday ${pdClass(a.valPlan,a.valFact)}">${fmtRub(ppd(a.valPlan,a.valFact))}/д</div>
  </div>`;

  // Дистрибуция
  const distRows = DISTRIB[id] || [];
  let weakVolHtml = '', weakAkbHtml = '';

  if (distRows.length > 0) {
    const byVol = [...distRows].filter(r=>r.plan_vol>0).sort((a,b)=>a.fact_vol_pct-b.fact_vol_pct).slice(0,10);
    byVol.forEach((r,i)=>{
      const p = Math.round(r.fact_vol_pct);
      weakVolHtml += `<div class="dist-row" style="animation-delay:${i*0.04}s">
        <div class="dist-cat">${r.cat}</div>
        <div class="dist-actual ${cClass(p)}">${p}%</div>
        <div class="dist-target">${fmtRub(r.fact_vol)}/${fmtRub(r.plan_vol)}</div>
        <div class="dist-bar"><div class="dist-bar-fill ${bgClass(p)}" style="width:${Math.min(p,100)}%"></div></div>
      </div>`;
    });
    const byAkb = [...distRows].filter(r=>r.goal_akb&&r.fact_akb!==null).sort((a,b)=>a.fact_akb-b.fact_akb).slice(0,10);
    byAkb.forEach((r,i)=>{
      const p = Math.round(r.fact_akb/r.goal_akb*100);
      weakAkbHtml += `<div class="dist-row" style="animation-delay:${i*0.04}s">
        <div class="dist-cat">${r.cat}</div>
        <div class="dist-actual ${cClass(p)}">${r.fact_akb.toFixed(1)}%</div>
        <div class="dist-target">цель ${r.goal_akb}%</div>
        <div class="dist-bar"><div class="dist-bar-fill ${bgClass(p)}" style="width:${Math.min(p,100)}%"></div></div>
      </div>`;
    });
  } else {
    weakVolHtml = `<div style="font-family:var(--fm);font-size:11px;color:var(--ink3);padding:12px 10px;letter-spacing:1px">Данные дистрибуции будут добавлены</div>`;
    weakAkbHtml = weakVolHtml;
  }

  document.getElementById('panel-right').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${a.name}</div>
        <div class="detail-team">${a.team}</div>
      </div>
      <div class="detail-score">
        <div class="detail-score-val ${cClass(vP)}">${vP}%</div>
        <div class="detail-score-label">ВАЛ</div>
      </div>
    </div>
    <div class="forecast-banner">
      <div class="fc-card">
        <div class="fc-card-label">Прогноз</div>
        <div class="fc-card-val ${cClass(a.valProg)}">${a.valProg}%</div>
        <div class="fc-card-sub">≈ ${fmtRub(a.valProgRub)}</div>
      </div>
      <div class="fc-card">
        <div class="fc-card-label">АКБ</div>
        <div class="fc-card-val ${cClass(aP)}">${aP}%</div>
        <div class="fc-card-sub">${a.akbFact} / ${a.akbPlan} точек</div>
      </div>
      <div class="fc-card">
        <div class="fc-card-label">П/день (вал)</div>
        <div class="fc-card-val" style="color:var(--orange)">${fmtRub(ppd(a.valPlan,a.valFact))}</div>
        <div class="fc-card-sub">осталось ${CAL.days_left} дней</div>
      </div>
      <div class="fc-card">
        <div class="fc-card-label">Период</div>
        <div class="fc-card-val" style="color:var(--ink2);font-size:14px">${CAL.days_passed} из ${CAL.days_total}</div>
        <div class="fc-card-sub">${CAL.progress_pct}% месяца · ${CAL.date}</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">КПИ задачи</div>
      <div style="display:grid;grid-template-columns:200px 1fr 56px 56px 80px 80px 90px;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)">
        <div style="font-family:var(--fm);font-size:9px;color:var(--ink3);letter-spacing:1px">ПОКАЗАТЕЛЬ</div>
        <div></div>
        <div style="font-family:var(--fm);font-size:9px;color:var(--ink3);text-align:right">ФАКТ%</div>
        <div style="font-family:var(--fm);font-size:9px;color:var(--ink3);text-align:right">ПРОГН%</div>
        <div style="font-family:var(--fm);font-size:9px;color:var(--ink3);text-align:right">ФАКТ</div>
        <div style="font-family:var(--fm);font-size:9px;color:var(--ink3);text-align:right">ПЛАН</div>
        <div style="font-family:var(--fm);font-size:9px;color:var(--ink3);text-align:right">П/ДЕНЬ</div>
      </div>
      ${kpiHtml}
    </div>
    <div class="section">
      <div class="section-title">Дистрибуция · период ${CAL.distrib_period}</div>
      <div class="dist-grid">
        <div>
          <div class="dist-col-title worst-vol">▼ Слабые по объёму (руб)</div>
          ${weakVolHtml}
        </div>
        <div>
          <div class="dist-col-title worst-akb">▼ Слабые по АКБ (покрытие)</div>
          ${weakAkbHtml}
        </div>
      </div>
    </div>`;
}

// INIT
renderDept();
renderList();
</script>
